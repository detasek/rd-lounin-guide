version: "3.9"

services:
  backend:
    image: node:18
    container_name: rd-lounin-api
    working_dir: /app
    command: sh -c "npm install && node app.js"
    environment:
      - NODE_ENV=production
    volumes:
      - ./api:/app
      - ./data:/data
    ports:
      - "3010:3000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: rd-lounin-web
    volumes:
      - ./app:/usr/share/nginx/html
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rd-lounin-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - cloudflare
